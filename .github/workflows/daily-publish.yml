# Daily page publish: 7:00 AM IST, with backup runs at 8:00 AM, 10:00 AM and 1:00 PM IST.
# If a page in src/lib/publish-schedule.json is due today (IST), redeploy Railway (the build's publish gate
# then includes it), wait for the deploy, and check the page is live. A failure fails the run, and GitHub emails you.
# GitHub can delay or drop scheduled runs (it skipped 7 AM on 8 Oct 2026), so the backup runs retry; a run whose due
# pages are already live skips the deploy, so the site is rebuilt only once a day.
# Manual runs (Actions tab > Daily page publish > Run workflow) always deploy, as a test.
name: Daily page publish

on:
  schedule:
    - cron: "30 1 * * *" # 01:30 UTC = 07:00 IST (GitHub may start scheduled runs late, or drop them)
    - cron: "30 2 * * *" # 08:00 IST backup
    - cron: "30 4 * * *" # 10:00 IST backup
    - cron: "30 7 * * *" # 13:00 IST backup
    - cron: "30 9 * * *" # 15:00 IST backup (also catches days when Railway pauses Hobby deploys for a while)
    - cron: "30 11 * * *" # 17:00 IST backup
    # Evening launches (entries with "time": "19:00"): 7 PM IST, with backups at 7:30 PM and 8:30 PM
    - cron: "30 13 * * *" # 19:00 IST
    - cron: "0 14 * * *" # 19:30 IST backup
    - cron: "0 15 * * *" # 20:30 IST backup
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

env:
  RAILWAY_API: https://backboard.railway.com/graphql/v2
  RAILWAY_SERVICE_ID: 1f7aa3d3-aeef-41c3-bd87-4f378288a47f # national-filings / web
  RAILWAY_ENVIRONMENT_ID: cadefc4f-c651-44d5-a55e-ca9ccdc20fa2 # production
  SITE: https://www.nationalfilings.co.in

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50 # room for up to 20 min of Railway "paused" retries plus the deploy itself
    steps:
      - uses: actions/checkout@v4

      - name: What is due today (IST)
        id: due
        run: |
          TODAY=$(TZ=Asia/Kolkata date +%F)
          NOW=$(TZ=Asia/Kolkata date +%H:%M)
          # Due today, and past its launch time when the entry has one (the publish gate holds it until then)
          DUE=$(node -e '
            const { log } = require("./src/lib/publish-schedule.json");
            const [today, now] = process.argv.slice(1);
            process.stdout.write(log.filter((e) => e.path && e.date === today && (!e.time || e.time <= now)).map((e) => e.path).join(" "));
          ' "$TODAY" "$NOW")
          # Due pages not live yet (an earlier run today may already have published them)
          PENDING=""
          for P in $DUE; do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "$SITE$P")" = "200" ] || PENDING="$PENDING $P"
          done
          PENDING=$(echo $PENDING)
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          echo "paths=$DUE" >> "$GITHUB_OUTPUT"
          echo "pending=$PENDING" >> "$GITHUB_OUTPUT"
          echo "Today $TODAY $NOW IST. Due: ${DUE:-nothing}. Not live yet: ${PENDING:-none}"

      - name: Deploy on Railway
        if: steps.due.outputs.pending != '' || github.event_name == 'workflow_dispatch'
        id: deploy
        env:
          TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          gql() { curl -sS "$RAILWAY_API" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$1"; }
          # Railway sometimes pauses Hobby deploys during busy periods ("Deploys have been paused temporarily").
          # Keep asking for up to 20 minutes; if it's still paused, fail and let the next backup run try again.
          for try in $(seq 1 20); do
            RES=$(gql "{\"query\":\"mutation { serviceInstanceDeployV2(serviceId: \\\"$RAILWAY_SERVICE_ID\\\", environmentId: \\\"$RAILWAY_ENVIRONMENT_ID\\\", commitSha: \\\"$GITHUB_SHA\\\") }\"}")
            ID=$(echo "$RES" | jq -r '.data.serviceInstanceDeployV2 // empty')
            [ -n "$ID" ] && break
            if echo "$RES" | grep -qi "paused"; then echo "$(date +%T) Railway deploys are paused, retrying in 60s ($try/20)"; sleep 60; continue; fi
            echo "Deploy request failed: $RES"; exit 1
          done
          if [ -z "$ID" ]; then echo "Railway deploys still paused after 20 minutes; the next scheduled run will retry"; exit 1; fi
          echo "Deployment $ID for commit ${GITHUB_SHA:0:7}"
          for i in $(seq 1 60); do
            STATUS=$(gql "{\"query\":\"{ deployment(id: \\\"$ID\\\") { status } }\"}" | jq -r '.data.deployment.status')
            echo "$(date +%T) $STATUS"
            case "$STATUS" in
              SUCCESS) exit 0 ;;
              FAILED|CRASHED|REMOVED|SKIPPED) echo "Deploy ended with $STATUS (the live site is unchanged)"; exit 1 ;;
            esac
            sleep 20
          done
          echo "Timed out waiting for the deploy"; exit 1

      - name: Check the new pages are live
        if: steps.due.outputs.paths != ''
        run: |
          for P in ${{ steps.due.outputs.paths }}; do
            for i in $(seq 1 12); do
              CODE=$(curl -s -o /dev/null -w '%{http_code}' "$SITE$P")
              [ "$CODE" = "200" ] && break
              sleep 10
            done
            echo "$SITE$P -> $CODE"
            [ "$CODE" = "200" ] || exit 1
            curl -s "$SITE/sitemap.xml" | grep -q "$SITE$P<" || { echo "$P missing from sitemap"; exit 1; }
            curl -s "$SITE/publish-log.csv" | grep -q "$SITE$P" || { echo "$P missing from publish-log.csv"; exit 1; }
          done
          echo "Published: ${{ steps.due.outputs.paths }}"

      # Writes the work log into the "national filings works" Google Sheet (scripts/work-log-sheet.gs).
      # Runs on every day with a launch, even when the page was already live, so a missed update is caught up.
      - name: Update the Google Sheet
        if: steps.due.outputs.paths != '' || github.event_name == 'workflow_dispatch'
        env:
          HOOK: ${{ secrets.SHEET_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "SHEET_HOOK_URL is not set yet, skipping the sheet update"; exit 0; fi
          OUT=$(curl -sSL --max-time 60 "$HOOK")
          echo "Sheet: $OUT"
          case "$OUT" in ok*) ;; *) echo "Sheet update failed"; exit 1 ;; esac
